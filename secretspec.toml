[project]
name = "reader"
revision = "1.0"

# Local development variables declared for SecretSpec. The dotenv provider
# stores values in .env (gitignored); `secretspec run` injects them into the Go
# process started by `devenv up`.
[profiles.default]
APP_PASSWORD = { description = "Local login password", default = "dev-password" }
APP_URL = { description = "Local origin; must match the Vite dev server", default = "http://localhost:5173" }
PORT = { description = "HTTP listen port", default = "8080" }
DATA_DIR = { description = "SQLite data directory", default = ".data" }
SESSION_SECRET = { description = "Session signing secret; generated on first run", type = "hex", generate = { bytes = 32 } }
ALLOW_PRIVATE_NETWORK = { description = "Allow fetching private network addresses", default = "false" }
